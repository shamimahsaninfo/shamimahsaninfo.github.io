ও গুরুত্ব)`,startPage:1,endPage:4,pages:[{pageNumber:1,chapterTitle:`কিতাবুল ঈমান (كتاب الإيمان)`,sections:[{id:`sec-1-1`,heading:`ঈমানের আভিধানিক ও পারিভাষিক অর্থ`,content:`ঈমান (الإيمان) আরবি শব্দ। এর আভিধানিক অর্থ বিশ্বাস স্থাপন করা, স্বীকৃতি দেওয়া, আস্থা রাখা এবং নিরাপত্তা দেওয়া। ইসলামি শরিয়তের পরিভাষায়, মহান আল্লাহ তাআলা ও তাঁর রসুল হযরত মুহাম্মদ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম কর্তৃক আনীত যাবতীয় মৌলিক বিধানাবলি অন্তরে দৃঢ়ভাবে বিশ্বাস করা, মুখে স্বীকার করা এবং তদনুযায়ী বাস্তব জীবনে আমল করার নামই ঈমান।`,arabicText:`الإِيمَانُ أَنْ تُؤْمِنَ بِاللَّهِ وَمَلائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ وَالْيَوْمِ الآخِرِ وَتُؤْمِنَ بِالْقَدَرِ خَيْرِهِ وَشَرِّهِ`,translation:`অর্থ: "ঈমান হলো এই যে, তুমি বিশ্বাস স্থাপন করবে আল্লাহ তাআলার প্রতি, তাঁর ফেরেশতাগণের প্রতি, তাঁর অবতীর্ণ কিতাবসমূহের প্রতি, তাঁর প্রেরিত রসুলগণের প্রতি, পরকালের প্রতি এবং ভাগ্যের ভালো-মন্দের প্রতি।" (সহীহ মুসলিম: হাদিস ১)`,boxNote:`বিশেষ জ্ঞাতব্য: ইমাম আবু হানিফা (রহ.)-এর মতে ঈমানের মূল স্তম্ভ হলো অন্তরে বিশ্বাস ও মুখে স্বীকৃতি।`}]},{pageNumber:2,chapterTitle:`হাদিসে জিবরিল ও ইসলামের রুকনসমূহ`,sections:[{id:`sec-1-2`,heading:`হাদিসে জিবরিল (হযরত উমর রা. বর্ণিত)`,content:`হযরত উমর ইবনুল খাত্তাব (রা.) থেকে বর্ণিত, তিনি বলেন— একদিন আমরা রাসুলুল্লাহ (সা.)-এর দরবারে উপবিষ্ট ছিলাম। এমন সময় ধবধবে সাদা পোশাক পরিহিত ও কুচকুচে কালো চুলবিশিষ্ট এক আগন্তুক আগমন করলেন। তাঁর মধ্যে সফরের কোনো চিহ্ন পরিলক্ষিত হচ্ছিল না এবং আমাদের মধ্যকার কেউ তাঁকে চিনতেও পারছিল না। তিনি রাসুল (সা.)-এর হাঁটুর সাথে হাঁটু মিলিয়ে বসলেন এবং জিজ্ঞাসা করলেন— হে মুহাম্মদ! আমাকে ইসলাম সম্পর্কে অবহিত করুন।`,arabicText:`بُنِيَ الإِسْلامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لا إِلَهَ إِلا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلاةِ، وَإِيتَاءِ الزَّكَاةِ، وَحَجِّ الْبَيْتِ، وَصَوْمِ رَمَضَانَ`,translation:`অর্থ: রাসুলুল্লাহ (সা.) এরশাদ করেন: "ইসলামের ভিত্তি পাঁচটি স্তম্ভের ওপর স্থাপিত— এ সাক্ষ্য দেওয়া যে, আল্লাহ ছাড়া কোনো সত্য উপাস্য নেই এবং মুহাম্মদ (সা.) তাঁর বান্দা ও রাসুল; নামাজ কায়েম করা; জাকাত আদায় করা; বায়তুল্লাহ শরিফে হজ সম্পাদন করা এবং রমজান মাসের রোজা পালন করা।" (সহীহ বুখারী: হাদিস ৮)`},{id:`sec-1-3`,heading:`ইহসানের স্বরূপ`,content:`হাদিসের পরবর্তী অংশে রাসুল (সা.) ইহসান সম্পর্কে ব্যাখ্যা দেন: "তুমি এমনভাবে আল্লাহর ইবাদত করবে যেন তুমি তাঁকে দেখছ। আর যদি তুমি তাঁকে দেখতে না পাও, তবে নিশ্চিত জানবে যে তিনি তোমাকে অবলোকন করছেন।"`}]},{pageNumber:3,chapterTitle:`ঈমানের শাখা-প্রশাখা ও মিষ্টতা`,sections:[{id:`sec-1-4`,heading:`ঈমানের সত্তরের অধিক শাখা`,content:`হযরত আবু হুরায়রা (রা.) হতে বর্ণিত, রাসুলুল্লাহ (সা.) বলেন: ঈমানের সত্তরেরও অধিক শাখা রয়েছে। তার মধ্যে সর্বোত্তম শাখা হলো "লা ইলাহা ইল্লাল্লাহ" বলা এবং সর্বনিম্ন শাখা হলো রাস্তা থেকে কষ্টদায়ক বস্তু সরিয়ে ফেলা। আর লজ্জা হলো ঈমানের একটি বিশেষ শাখা।`,bulletPoints:[`সর্বোচ্চ শাখা: তাওহীদের কালেমার অটল বিশ্বাস ও ঘোষণা।`,`মানবকল্যাণমূলক শাখা: জনসাধারণের চলার পথ থেকে কাঁটা, পাথর, ময়লা অপসারণ।`,`নৈতিক শাখা: লজ্জা ও চরিত্রনিষ্ঠা, যা মানুষকে পাপ কাজ থেকে বিরত রাখে।`]},{id:`sec-1-5`,heading:`ঈমানের স্বাদ লাভের তিনটি শর্ত`,content:`হযরত আনাস (রা.) হতে বর্ণিত, নবী কারিম (সা.) বলেন: যার মধ্যে তিনটি গুণ বিদ্যমান থাকবে সে ঈমানের প্রকৃত স্বাদ ও মিষ্টতা অনুভব করবে:`,bulletPoints:[`১. আল্লাহ ও তাঁর রাসুল তার নিকট অন্য সবকিছুর চেয়ে অধিক প্রিয় হওয়া।`,`২. কোনো ব্যক্তিকে কেবল আল্লাহর সন্তুষ্টির জন্যই ভালোবাসা।`,`৩. কুফর ও পাপের পথ থেকে ফিরে আসার পর পুনরায় তাতে ফিরে যাওয়াকে আগুনে নিক্ষেপ হওয়ার মতো অপছন্দ করা।`]}]},{pageNumber:4,chapterTitle:`অনুশীলনী ও মূল্যায়ন প্রশ্ন`,sections:[{id:`sec-1-eval`,heading:`পাঠ মূল্যায়ন ও সারসংক্ষেপ`,content:`এই অধ্যায়ে আমরা ঈমানের সংজ্ঞা, ইসলামের পাঁচটি ভিত্তি, হাদিসে জিবরিলের তাৎপর্য এবং ঈমানের শাখা-প্রশাখা সম্পর্কে বিশদ জ্ঞান অর্জন করেছি। একজন মুমিনের জীবনে ঈমানের প্রতিফলন ঘটবে তার আখলাক ও আমলের মাধ্যমে।`}]}],mcqs:[{id:`m1`,question:`ঈমান শব্দের আভিধানিক অর্থ কী?`,options:[`ইবাদত করা`,`বিশ্বাস স্থাপন ও স্বীকৃতি দেওয়া`,`নামাজ পড়া`,`জ্ঞান অর্জন করা`],correctIndex:1,explanation:`ঈমান আরবি শব্দ যার মূল অর্থ বিশ্বাস স্থাপন, আস্থা রাখা ও অন্তরের স্বীকৃতি।`},{id:`m2`,question:`হাদিস অনুযায়ী ঈমানের সর্বনিম্ন শাখা কোনটি?`,options:[`সালাম প্রদান করা`,`ক্ষমা করা`,`রাস্তা থেকে কষ্টদায়ক বস্তু সরানো`,`দান করা`],correctIndex:2,explanation:`হাদিসে রাসুল (সা.) বলেছেন ঈমানের সর্বনিম্ন শাখা হলো রাস্তা থেকে কষ্টদায়ক বস্তু অপসারণ করা।`}],creativeQuestions:[{id:`cq1`,stimulus:`তাহমিদ সাহেব নিয়মিত সালাত আদায় করেন এবং পাড়ার রাস্তায় জমে থাকা আবর্জনা পরিষ্কার করতে যুবকদের উদ্বুদ্ধ করেন। অন্যদিকে তার বন্ধু শফিক মনে করে শুধু অন্তরে বিশ্বাস রাখলেই যথেষ্ট, বাহ্যিক সৎকাজের তেমন প্রয়োজন নেই।`,partA:`ইহসান শব্দের অর্থ কী?`,partB:`লজ্জা ঈমানের অঙ্গ— হাদিসের আলোকে ব্যাখ্যা করো।`,partC:`তাহমিদ সাহেবের কাজে হাদিসের কোন শিক্ষার প্রতিফলন ঘটেছে তা বিশ্লেষণ করো।`,partD:`শফিকের মনোভাব হাদিসে জিবরিল ও ঈমানের রুকনসমূহের আলোকে সঠিক কিনা মতামত দাও।`,answerSummary:`তাহমিদ সাহেবের কাজ ঈমানের শাখা-প্রশাখা ও সমাজসেবার বাস্তব প্রয়োগ। শফিকের মনোভাব ত্রুটিপূর্ণ, কারণ হাদিস অনুযায়ী অন্তরে বিশ্বাস, মুখে স্বীকৃতি ও অঙ্গে আমল তিনটির সমন্বয় আবশ্যক।`}]},{id:`ch-2`,chapterNumber:`২য় অধ্যায়`,title:`কিতাবুত্ব ত্বাহারাত (পবিত্রতা ও তাহারাত)`,startPage:5,endPage:8,pages:[{pageNumber:5,chapterTitle:`কিতাবুত্ব ত্বাহারাত (পবিত্রতা অর্জনের বিধান)`,sections:[{id:`sec-2-1`,heading:`পবিত্রতার গুরুত্ব ও ফজিলত`,content:`ত্বাহারাত (الطهارة) অর্থ পরিচ্ছন্নতা ও পবিত্রতা। ইসলামে আত্মিক ও শারীরিক উভয় প্রকার পবিত্রতাকে সালাত ও ইবাদতের অবিচ্ছেদ্য পূর্বশর্ত করা হয়েছে। রাসুলুল্লাহ (সা.) পবিত্রতাকে ঈমানের অর্ধাংশ ঘোষণা করেছেন।`,arabicText:`الطُّهُورُ شَطْرُ الإِيمَانِ، وَالْحَمْدُ لِلَّهِ تَمْلأُ الْمِيزَانَ`,translation:`অর্থ: "পবিত্রতা ঈমানের অর্ধাংশ। আর ‘আলহামদুলিল্লাহ’ পাঠ মিজানের পাল্লাকে পূর্ণ করে দেয়।" (সহীহ মুসলিম)`},{id:`sec-2-2`,heading:`অজুর ফরজ ও সুন্নতসমূহ`,content:`অজু হলো বিশেষ পদ্ধতিতে নির্দিষ্ট চারটি অঙ্গ ধৌত করার বিধান। পবিত্র কুরআনে আল্লাহ তাআলা ইরশাদ করেছেন:`,arabicText:`يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا قُمْتُمْ إِلَى الصَّلاةِ فَاغْسِلُوا وُجُوهَكُمْ وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ وَامْسَحُوا بِرُءُوسِكُمْ وَأَرْجُلَكُمْ إِلَى الْكَعْبَيْنِ`,translation:`অর্থ: "হে মুমিনগণ! যখন তোমরা সালাতের জন্য দাঁড়াতে ইচ্ছা করো, তখন তোমাদের মুখমণ্ডল ও হাত কনুই পর্যন্ত ধৌত করো, মাথা মাসেহ করো এবং পা দুটি টাখনু পর্যন্ত ধৌত করো।" (সূরা আল-মায়েদা: ৬)`}]},{pageNumber:6,chapterTitle:`অজুর পানির অপচয় রোধ ও মিসওয়াকের ফজিলত`,sections:[{id:`sec-2-3`,heading:`মিসওয়াকের গুরুত্ব`,content:`রাসুলুল্লাহ (সা.) বলেন: "যদি আমার উম্মতের ওপর কষ্টকর মনে না হতো, তবে আমি প্রত্যেক সালাতের পূর্বে মিসওয়াক করার নির্দেশ দিতাম।" মিসওয়াক মুখের দুর্গন্ধ দূর করে, দাঁত মজবুত করে এবং আল্লাহর সন্তুষ্টি লাভের উপায়।`},{id:`sec-2-4`,heading:`অজুতে পানির অপচয় নিষেধ`,content:`রাসুলুল্লাহ (সা.) একবার সাদ (রা.)-কে অজু করতে দেখে বললেন, "হে সাদ! এ কেমন অপচয়?" সাদ (রা.) আরজ করলেন, "অজুতেও কি অপচয় হয়?" রাসুল (সা.) বললেন, "হ্যাঁ, এমনকি তুমি যদি প্রবহমান নদীর তীরেও অবস্থান করো তবুও অপচয় করবে না।"`}]}]}]},{id:`chemistry`,title:`রসায়ন ২০২৬`,subtitle:`দাখিল ও মাধ্যমিক ৯ম-১০ম শ্রেণি`,year:`২০২৬`,classGrade:`৯ম-১০ম শ্রেণি`,category:`বিজ্ঞান`,board:`জাতীয় শিক্ষাক্রম ও পাঠ্যপুস্তক বোর্ড, বাংলাদেশ`,coverTheme:{primaryColor:`#6d28d9`,secondaryColor:`#a855f7`,accentColor:`#38bdf8`,pattern:`science`,tagline:`পদার্থের গঠন, পর্যায় সারণি ও রাসায়নিক বন্ধন`},totalPages:240,officialPdfUrl:`https://nctb.gov.bd/site/page/chemistry-class-9-10-2026`,description:`জাতীয় শিক্ষাক্রম ও পাঠ্যপুস্তক বোর্ড কর্তৃক অনুমোদিত নবম ও দশম শ্রেণির রসায়ন বিজ্ঞান বই। পদার্থের অবস্থা, পরমাণুর গঠন, পর্যায় সারণি, রাসায়নিক বন্ধন ও অম্ল-ক্ষারক সম্পর্কিত পূর্ণাঙ্গ পাঠ্যপুস্তক।`,chapters:[{id:`chem-ch-1`,chapterNumber:`১ম অধ্যায়`,title:`রসায়নের ধারণা (Concepts of Chemistry)`,startPage:1,endPage:3,pages:[{pageNumber:1,chapterTitle:`রসায়নের ধারণা ও পরিধি`,sections:[{id:`ch1-s1`,heading:`রসায়ন কী?`,content:`বিজ্ঞানের যে শাখায় পদার্থের গঠন, পদার্থের ধর্ম এবং পদার্থের পরিবর্তন নিয়ে আলোচনা করা হয়, তাকে রসায়ন (Chemistry) বলে। সৃষ্টির শুরু থেকেই মানুষ জীবনের প্রয়োজনে রসায়নের প্রত্যক্ষ প্রয়োগ করে আসছে। প্রাচীনকালে মিসরে প্রথম সোনা, তামা ও রূপা নিষ্কাশন প্রক্রিয়ায় ধাতুর রাসায়নিক রূপান্তর শুরু হয়।`,boxNote:`তথ্যকণিকা: প্রাচীন আলকেমি (Alchemy)
