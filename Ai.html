<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আল আহসান ইসলামিক এআই</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #1e293b;
        }

        /* Header Theme */
        header {
            background: #ffffff;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-box {
            width: 36px;
            height: 36px;
            background: #00b09b;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-box svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }
        .brand-title {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
        }
        .badge-pill {
            background: #e6f4ea;
            color: #137333;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid #ceead6;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 5px 10px;
            font-size: 0.75rem;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        /* Welcome Screen Layout */
        .welcome-screen {
            text-align: center;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 10px;
        }
        .arabic-bismillah {
            font-size: 1.7rem;
            color: #0d9488;
            font-weight: bold;
        }
        .bismillah-sub {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 8px;
        }
        .hero-logo-box {
            width: 70px;
            height: 70px;
            background: #00b09b;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0,176,155,0.2);
            margin-bottom: 5px;
        }
        .hero-logo-box svg {
            width: 38px;
            height: 38px;
            fill: #ffffff;
        }
        .welcome-screen h2 {
            font-size: 1.25rem;
            color: #0f172a;
            font-weight: 700;
        }
        .welcome-screen p {
            font-size: 0.85rem;
            color: #475569;
            max-width: 480px;
            line-height: 1.5;
        }
        .feature-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 6px;
        }
        .chip {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Chat History */
        .chat-history {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            display: none; 
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.6;
            font-size: 0.92rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.user {
            background-color: #00b09b;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }
        .message.ai {
            background-color: #ffffff;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .message.loading {
            color: #64748b;
            font-style: italic;
        }

        /* Input Footer */
        .footer-section {
            background: #f8fafc;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 16px;
        }
        .input-box-container {
            background: #ffffff;
            border: 1.5px solid #00b09b;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 6px 8px 6px 14px;
            width: 100%;
            max-width: 750px;
            box-shadow: 0 4px 12px rgba(0,176,155,0.08);
        }
