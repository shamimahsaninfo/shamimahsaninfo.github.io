<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আল আহসান ইসলামিক এআই</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'SolaimanLipi', Arial, sans-serif; background-color: #f0f4f3; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #00897b; color: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: white; padding: 2px; }
        .header-left h1 { font-size: 16px; font-weight: 600; }
        .header-left p { font-size: 11px; opacity: 0.9; }
        #api-btn { background: #ffffff; color: #00897b; border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #eaf2f1; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.6; word-wrap: break-word; font-size: 15px; }
        .user-message { background-color: #00897b; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message { background-color: #ffffff; color: #2c3e50; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #d2dedb; }
        #input-container { display: flex; padding: 10px 12px; background: white; border-top: 1px solid #d2dedb; align-items: center; }
        #user-input { flex: 1; padding: 12px 15px; border: 1px solid #b2dfdb; border-radius: 25px; font-size: 15px; outline: none; background-color: #f7fcfc; }
        #send-btn { background-color: #00897b; color: white; border: none; width: 45px; height: 45px; margin-left: 8px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        /* মোডাল ডিজাইন */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
        .modal-content input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 5px; }
        .modal-content button { background: #00897b; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="logo.png" alt="Logo">
            <div>
                <h1>আল আহসান</h1>
                <p>কুরআন ও সহীহ হাদিসের আলোকে</p>
            </div>
        </div>
        <button id="api-btn" onclick="openModal()">⚙️ এআই সেটআপ</button>
    </header>

    <div id="chat-container">
        <div class="message ai-message">আসসালামু আলাইকুম! আমি 'আল আহসান ইসলামিক এআই'। পবিত্র কুরআন ও সহীহ হাদিসের আলোকে আপনার যেকোনো প্রশ্ন করতে পারেন। ইনশাআল্লাহ সঠিক দলিলসহ উত্তর দেওয়া হবে।</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="কুরআন ও হাদিসের আলোকে যেকোনো প্রশ্ন লিখুন..." />
        <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <!-- এপিআই কি সেট করার পপআপ -->
    <div id="modal">
        <div class="modal-content">
            <h3>গুগল জেমিনি এআই কি (API Key)</h3>
            <p style="font-size: 13px; color: #666; margin-top: 5px;">আপনার জেমিনি এপিআই কি এখানে একবার লিখে সংরক্ষণ করুন:</p>
            <input type="password" id="api-input" placeholder="আপনার API Key এখানে পেস্ট করুন..." />
            <br>
            <button onclick="saveApiKey()">সংরক্ষণ করুন</button>
        </div>
    </div>

    <script>
        // ব্রাউজারে এপিআই কি সেভ রাখার ব্যবস্থা
        let API_KEY = localStorage.getItem("gemini_api_key") || "";

        function openModal() {
            document.getElementById("modal").style.display = "flex";
            document.getElementById("api-input").value = API_KEY;
        }

        function saveApiKey() {
            const key = document.getElementById("api-input").value.trim();
            if (key) {
                localStorage.setItem("gemini_api_key", key);
                API_KEY = key;
                document.getElementById("modal").style.display = "none";
                alert("এপিআই কি সফলভাবে সংরক্ষিত হয়েছে!");
            } else {
                alert("দয়া করে সঠিক এপিআই কি দিন।");
            }
        }

        // প্রথমবার কি না থাকলে পপআপ দেখানো
        window.onload = function() {
            if (!API_KEY) {
                document.getElementById("modal").style.display = "flex";
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const userText = inputField.value.trim();

            if (!userText) return;

            if (!API_KEY) {
                alert("দয়া করে প্রথমে ওপরের 'এআই সেটআপ' থেকে আপনার জেমিনি এপিআই কি (API Key) যুক্ত করুন।");
                openModal();
                return;
            }

            chatContainer.innerHTML += `<div class="message user-message">${userText}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = "loading-" + Date.now();
            chatContainer.innerHTML += `<div id="${loadingId}" class="message ai-message">দলিল ও উত্তর খোঁজা হচ্ছে...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [
                                    { text: "System Instruction: তুমি 'আল আহসান ইসলামিক এআই'। তুমি একজন বিশ্বস্ত ও অভিজ্ঞ ইসলামিক জ্ঞানভিত্তিক সহকারী। ব্যবহারকারীর প্রশ্নের উত্তর সবসময় পবিত্র কুরআন, সহীহ হাদিস এবং গ্রহণযোগ্য ইসলামিক পন্ডিতদের মতামতের আলোকে দলিলসহ (সূরা/আয়াত বা হাদিস গ্রন্থ ও নম্বরসহ) প্রদান করবে। কোনো মনগড়া বা ভুল তথ্য দেবে না।" },
                                    { text: userText }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    chatContainer.innerHTML = chatContainer.innerHTML + `<div class="message ai-message">${aiReply.replace(/\n/g, '<br>')}</div>`;
                } else {
                    chatContainer.innerHTML += `<div class="message ai-message">দুঃখিত, এপিআই কি (API Key) সঠিক নয় অথবা সার্ভারে সমস্যা হয়েছে। দয়া করে আপনার কি (API Key) চেক করুন।</div>`;
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `<div class="message ai-message">নেটওয়ার্ক সংযোগে সমস্যা হচ্ছে।</div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
